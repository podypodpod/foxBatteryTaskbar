name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

# All actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json # same SDK as local builds

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results

      - name: Publish single-file exes (x64 and ARM64)
        shell: pwsh
        run: |
          $common = '-c','Release','--self-contained','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true'
          dotnet publish src/FoxBatteryTaskbar -r win-x64 @common -o out/x64
          dotnet publish src/FoxBatteryTaskbar -r win-arm64 @common -o out/arm64
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item out/x64/FoxBatteryTaskbar.exe publish/FoxBatteryTaskbar.exe
          Copy-Item out/arm64/FoxBatteryTaskbar.exe publish/FoxBatteryTaskbar-arm64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FoxBatteryTaskbar
          path: publish/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FoxBatteryTaskbar

      - name: Checksum
        run: sha256sum *.exe > SHA256SUMS.txt

      - name: Attest build provenance
        # Lets users verify the exe was built by this workflow:
        #   gh attestation verify FoxBatteryTaskbar.exe --repo <owner>/foxBatteryTaskbar
        # Attestations need a public repo (or GitHub Enterprise), so skip while private.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.exe"

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            FoxBatteryTaskbar.exe
            FoxBatteryTaskbar-arm64.exe
            SHA256SUMS.txt
          generate_release_notes: true
